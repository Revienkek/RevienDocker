  <!-- rueda (sin marcas, como el producto) -->
  <path d="M700 494v52a90 90 0 0 0 180 0v-52Z" fill="#1c1c21"/>
  <path d="M700 494v52a90 90 0 0 0 180 0v-52" stroke="#fff" stroke-opacity=".62" stroke-width="8"/>

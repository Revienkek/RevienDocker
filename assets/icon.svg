      <rect width="150" height="150" rx="32" fill="url(#cap)" stroke="#fff"/>
      <path d="M24 46q6-20 26-24M62 20h26" stroke="#fff" stroke-opacity=".6" stroke-width="7"/>
      <path transform="translate(96 98) scale(.78)" stroke="#fff" stroke-opacity=".7" stroke-width="8" d="M2 14L20 52L38 14"/>
    </g>
    <g transform="translate(522 410)">
      <rect y="30" width="150" height="150" rx="32" fill="#1c1c21" stroke="#fff" stroke-opacity=".62" stroke-width="8"/>
      <rect width="150" height="150" rx="32" fill="url(#cap)" stroke="#fff"/>
      <path d="M24 46q6-20 26-24M62 20h26" stroke="#fff" stroke-opacity=".6" stroke-width="7"/>
      <path transform="translate(94 88) scale(.78)" stroke="#fff" stroke-opacity=".7" stroke-width="8" d="M2 0V52H18Q42 52 42 26Q42 0 18 0Z"/>
